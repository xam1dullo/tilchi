# API keys come from LIVEKIT_KEYS ("<key>: <secret>") set in docker-compose,
# so Nest and LiveKit read the same pair from one env source.
# Signaling (7880) is reached only through nginx at /rtc.
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  # Single-port UDP mux: one firewall rule, cheap on Docker port publishing.
  udp_port: 7882
  use_external_ip: false
room:
  max_participants: 12
  empty_timeout: 300
