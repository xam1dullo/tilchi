worker_processes auto;
events {
  worker_connections 1024;
}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 20m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream start_app {
    server start:3000;
  }
  upstream nest_app {
    server nest:3001;
  }
  upstream livekit_app {
    server livekit:7880;
  }

  # Server blocks come from /etc/nginx/templates/default.conf.template
  # (dev.conf.template locally, prod.conf.template on the VPS).
  include /etc/nginx/conf.d/*.conf;
}
