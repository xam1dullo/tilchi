# Path contract (BUILD-BRIEF, ADR 0010). Included by every server block.
#
# All proxy_set_header lines live here at server level. Any location that
# sets its own proxy_set_header silently drops every inherited one, so
# locations below must not set headers.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# nginx is the edge (Cloudflare is DNS-only). Replace, never append, so a
# client cannot prepend its own X-Forwarded-For entry. Nest trusts one hop.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

location /api/ {
  proxy_pass http://nest_app;
}
location /auth/ {
  proxy_pass http://nest_app;
}
location /bot/ {
  proxy_pass http://nest_app;
}
location /ws/canvas {
  proxy_pass http://nest_app;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

# Clients use LIVEKIT_PUBLIC_URL=wss://<host>/rtc. The SDK appends /rtc, so
# /rtc/rtc?... reaches LiveKit as /rtc?... after the prefix is stripped.
# Bare /rtc (connect to the public host root, SDK appends /rtc) is exact-match.
location = /rtc {
  proxy_pass http://livekit_app/rtc;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}
location ^~ /rtc/ {
  proxy_pass http://livekit_app/;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

location /ai/ {
  proxy_pass http://start_app;
  proxy_buffering off;
}
location / {
  proxy_pass http://start_app;
}
