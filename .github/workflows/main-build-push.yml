name: main-build-push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Open the held production deploy stub
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: held
        run: |
          echo "Production deploy is gated by the production environment."
          echo "This stub does not migrate, does not SSH, and does not read /etc/tilchi.env."
          echo "A later change will deploy image tag ${{ github.sha }} only after audit."
          exit 1
