name: main-build-push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Image tag (40-char git SHA) to deploy. Empty = this commit. Rollback = the previous SHA.
        type: string
        required: false

permissions: {}

jobs:
  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.repo.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Held. Runs only by hand, only inside the `production` environment, and
  # exits before any SSH or migration. Unholding needs owner approval and
  # required reviewers on the environment (ADR 0010).
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: resolve tag
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "bad sha: $sha"; exit 2; }
          echo "TILCHI_SHA=$sha" >> "$GITHUB_ENV"
      - name: held
        run: |
          echo "Would run on the VPS over SSH: scripts/vps-deploy.sh $TILCHI_SHA"
          echo "That script pulls images, migrates, then runs compose up -d."
          echo "Production deploy is held until audit and owner approval."
          exit 1
