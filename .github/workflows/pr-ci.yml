name: pr-ci

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tilchi/web routes
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contrast
      - run: docker compose config --quiet
