services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - start
      - nest
      - livekit

  start:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_INTERNAL_URL: http://nest:3001
      PORT: "3000"
    expose:
      - "3000"

  nest:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: Asia/Tashkent
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:-postgres://tilchi:tilchi@postgres:5432/tilchi}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set in .env (local) or /etc/tilchi.env (VPS)}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set in .env (local) or /etc/tilchi.env (VPS)}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tilchi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tilchi}
      POSTGRES_DB: ${POSTGRES_DB:-tilchi}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tilchi}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set in .env (local) or /etc/tilchi.env (VPS)}: ${LIVEKIT_API_SECRET:?set in .env (local) or /etc/tilchi.env (VPS)}"
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    # Signaling (7880) is reached only through nginx /rtc.
    expose:
      - "7880"
    ports:
      - "7881:7881"
      - "7882:7882/udp"

  coturn:
    image: coturn/coturn:4.6.2
    command:
      - -c
      - /etc/turnserver.conf
      - --user=${TURN_USER:?set in .env (local) or /etc/tilchi.env (VPS)}:${TURN_PASSWORD:?set in .env (local) or /etc/tilchi.env (VPS)}
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  pgdata:
